server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_user_db
    username: root
    password: JavaDeveloper@1998
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
   issuer: ecommerce-user-service
   access-token-expiration: 900000
   refresh-token-expiration: 604800000

admin:
   name: System Admin
   email: admin@ecommerce.com
   password: ChangeMe@123